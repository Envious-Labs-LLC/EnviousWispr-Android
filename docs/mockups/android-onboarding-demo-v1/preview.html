<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EnviousWispr · Setup demo</title><style>
@font-face{font-family:Jakarta;src:url(../android-onboarding-v2/regular.ttf)}@font-face{font-family:Jakarta;src:url(../android-onboarding-v2/bold.ttf);font-weight:700}
*{box-sizing:border-box}body{margin:0;background:#16121e;color:#eee9f6;font:14px Jakarta,sans-serif;--panel:#251f37;--line:#493d59;--sub:#b9accb;--accent:#c2a9ff}body.light{background:#f3eff8;color:#23192e;--panel:#fff;--line:#d5c9e3;--sub:#685877;--accent:#7544ce}
main{min-height:100vh;display:flex;justify-content:center;align-items:center;gap:64px;padding:28px}aside{width:270px;flex:none}h1{font-size:34px;letter-spacing:-1px;line-height:1.15;margin:14px 0 19px}.brand{color:var(--accent);font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase}p{color:var(--sub);line-height:1.7}label{display:block;color:var(--sub);font-size:12px;margin:23px 0 8px}select,button{font:inherit;background:var(--panel);color:inherit;border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer}select{width:100%}.controls{display:flex;gap:10px;margin-top:20px}.controls button{flex:1}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:4px}.theme{display:flex;align-items:center;gap:9px;font-size:14px}.theme input{accent-color:#8f6ae2;width:17px;height:17px}#phone{position:relative;border:7px solid #282631;border-radius:39px;overflow:hidden;flex:none;box-shadow:0 24px 90px #0004;background:#251f37;width:374px;height:654px}.screen{position:absolute;left:0;top:0;width:720px;height:1280px;transform:scale(var(--scale,.5));transform-origin:top left}.screen iframe{position:absolute;inset:0;width:720px;height:1280px;border:0;visibility:hidden;pointer-events:none}.screen iframe.active{visibility:visible}.scrub{width:100%;accent-color:#a78bfa;margin:20px 0 8px}.time{display:flex;justify-content:space-between;font-size:12px;color:var(--sub)}#caption{min-height:60px}#loading{font-size:12px;color:var(--accent)}
@media(max-width:760px){main{flex-direction:column;gap:24px;padding:22px 16px}aside{width:min(100%,440px)}h1{font-size:26px;margin:10px 0}p{margin:8px 0}.controls{margin-top:12px}label{margin-top:14px}#caption{min-height:0}.brand{font-size:11px}}
</style></head><body><main><aside><div class="brand">EnviousWispr</div><h1>Meet your floating lips.</h1><p id="caption">Works in every app with a text box.</p><label for="scene">Scene</label><select id="scene"><option value="0">1 · Works in every app</option><option value="1">2 · Meet the lips</option><option value="2">3 · Tap to dictate</option><option value="3">4 · Hold to talk</option><option value="4">5 · Your turn</option></select><label class="theme"><input id="theme" type="checkbox">Light theme</label><div class="controls"><button id="play">Pause</button><button id="replay">Replay all</button></div><label for="scrub">Scene timeline</label><input class="scrub" id="scrub" type="range" min="0" max="4" step="0.01" value="0"><div class="time"><span id="elapsed">0.0s</span><span id="duration">4.0s</span></div><p id="loading" role="status">Loading scenes…</p></aside><div id="phone" aria-label="Setup demo phone"><div class="screen" id="screen"></div></div></main><script>
const scenes=[
 ['scene-1-apps',4,'Works in every app with a text box.'],
 ['scene-2-lips',3.6,'This is your button. It floats beside any text box.'],
 ['scene-3-tap',4,'Tap to start. Tap the check to finish.'],
 ['scene-4-hold',4,'Or hold while you talk. Let go to finish.'],
 ['scene-5-yours',3.6,'Your turn. Tap or hold the lips.']
];
const $=s=>document.querySelector(s);let index=0,time=0,previous=0,playing=!matchMedia('(prefers-reduced-motion: reduce)').matches;
let light=new URLSearchParams(location.search).get('theme')==='light';const ready=new Set();
const frames=scenes.map(([name,duration,caption])=>{const f=document.createElement('iframe');f.title=caption;f.src=name+'/index.html?theme='+(light?'light':'dark')+'&capture=1';$('#screen').append(f);return f});
function send(){frames[index].contentWindow.postMessage({type:'ew-frame',time,theme:light?'light':'dark'},'*')}
function update(){frames.forEach((f,i)=>{f.classList.toggle('active',i===index);f.setAttribute('aria-hidden',String(i!==index))});$('#scene').value=index;$('#caption').textContent=scenes[index][2];$('#scrub').max=scenes[index][1];$('#scrub').value=time;$('#elapsed').textContent=time.toFixed(1)+'s';$('#duration').textContent=scenes[index][1].toFixed(1)+'s';$('#play').textContent=playing?'Pause':'Play';$('#play').setAttribute('aria-label',playing?'Pause demo':'Play demo');send()}
window.addEventListener('message',e=>{const i=frames.findIndex(f=>f.contentWindow===e.source);if(i>=0&&e.data?.type==='ew-ready'){ready.add(i);frames[i].contentWindow.postMessage({type:'ew-frame',time:0,theme:light?'light':'dark'},'*');$('#loading').textContent=ready.size===5?'':`Loading scenes (${ready.size}/5)…`;update()}});
$('#scene').onchange=e=>{index=Number(e.target.value);time=0;update()};
$('#theme').checked=light;document.body.classList.toggle('light',light);
$('#theme').onchange=e=>{light=e.target.checked;document.body.classList.toggle('light',light);frames.forEach(f=>f.contentWindow.postMessage({type:'ew-theme',theme:light?'light':'dark'},'*'));update()};
$('#play').onclick=()=>{if(index===4&&time>=scenes[4][1]){index=0;time=0}playing=!playing;update()};
$('#replay').onclick=()=>{index=0;time=0;playing=true;update()};
$('#scrub').oninput=e=>{playing=false;time=Number(e.target.value);update()};
function fit(){const mobile=innerWidth<=760;const width=Math.max(180,Math.min(mobile?360:440,innerWidth-46,(mobile?760:innerHeight-70)*720/1280));$('#phone').style.width=(width+14)+'px';$('#phone').style.height=(width*1280/720+14)+'px';$('#screen').style.setProperty('--scale',width/720)}
window.addEventListener('resize',fit);fit();update();
requestAnimationFrame(function tick(now){const dt=previous?Math.min(.1,(now-previous)/1000):0;previous=now;if(playing&&ready.size===5&&!document.hidden){time+=dt;if(time>=scenes[index][1]){if(index<4){time-=scenes[index][1];index++}else{time=scenes[index][1];playing=false}}update()}requestAnimationFrame(tick)});
</script></body></html>
