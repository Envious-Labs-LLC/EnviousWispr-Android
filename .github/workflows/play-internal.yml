name: Google Play internal testing
on:
  push:
    branches: [internal-testing]
permissions:
  contents: read
concurrency:
  group: play-internal
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PLAY_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Assign increasing Play version
        run: echo "PLAY_VERSION_CODE=$((GITHUB_RUN_NUMBER + 100))" >> "$GITHUB_ENV"
      - name: Build and test the pushed source
        run: bash scripts/release/build.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-play-bundle
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - name: Save test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-test-results
          path: app/build/test-results/testReleaseUnitTest/
          if-no-files-found: warn
          retention-days: 14
  publish:
    needs: build
    if: github.repository == 'Envious-Labs-LLC/EnviousWispr-Android' && github.ref == 'refs/heads/internal-testing'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: play-internal
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: unsigned-play-bundle
          path: dist
      - name: Install publishing tools
        run: |
          python3 -m pip install google-auth==2.40.3 requests==2.32.4
          curl --fail --location --silent --show-error --retry 3 https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar -o "$RUNNER_TEMP/bundletool.jar"
          printf '%s  %s\n' a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29 "$RUNNER_TEMP/bundletool.jar" | sha256sum --check
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.PLAY_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.PLAY_SERVICE_ACCOUNT }}
          project_id: ageless-domain-493017-j8
      - name: Sign and publish to internal testing
        run: python3 scripts/release/publish.py
      - name: Save signed bundle and publication receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: published-play-bundle
          path: |
            dist/signed.aab
            dist/published.json
          if-no-files-found: error
          retention-days: 14
