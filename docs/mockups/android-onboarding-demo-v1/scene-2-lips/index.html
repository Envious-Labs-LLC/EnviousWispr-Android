<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=720"><title>This is your recording bubble.</title><style>
@font-face{font-family:PlusJakarta;src:url(../../android-onboarding-v2/regular.ttf);font-weight:400}
@font-face{font-family:PlusJakarta;src:url(../../android-onboarding-v2/bold.ttf);font-weight:700}
*{box-sizing:border-box}html,body{margin:0;width:720px;height:1280px;overflow:hidden}
body{--bg:#251F37;--surface:#201b2c;--text:#e8e4f1;--sub:#aaa2bf;--muted:#8a819e;--accent:#a78bfa;--border:#463957;background:var(--bg);color:var(--text);font:400 28px PlusJakarta,sans-serif}
body.light{--bg:#FFFFFF;--surface:#f0ecf8;--text:#160f22;--sub:#645675;--muted:#85778f;--accent:#7544ce;--border:#e7dff2}
#stage{position:relative;width:720px;height:1280px;background:var(--bg);overflow:hidden}
.head{position:absolute;left:52px;right:52px;top:64px;display:flex;justify-content:space-between;align-items:center}
.brand-mark{display:flex;align-items:center;gap:12px;font-size:32px;font-weight:700;letter-spacing:-1.3px;color:var(--text)}
.brand-lips{display:block;width:50px;height:50px;overflow:visible;flex-shrink:0}
.count{font-size:16px;letter-spacing:1px;color:var(--sub)}
.caption{position:absolute;left:52px;right:52px;top:236px;text-align:center;font-size:46px;line-height:1.2;letter-spacing:-1.6px;font-weight:700;opacity:0}
.caption small{display:block;margin-top:18px;font-size:26px;line-height:1.35;letter-spacing:-.3px;font-weight:400;color:var(--sub)}
/* The bubble at real size: 56 dp touch box, 48 dp ground, radius 14 dp, 12 dp from the edge; 2 px per dp. */
.bubble{position:absolute;top:640px;left:584px;width:112px;height:112px;display:grid;place-items:center}
.ground{width:96px;height:96px;border-radius:28px;display:grid;place-items:center;background:rgba(19,16,25,.64);box-shadow:0 4px 10px rgba(19,16,25,.20)}
.ground svg{display:block;width:76px;height:76px;overflow:visible}
.ground svg rect{stroke:rgba(19,16,25,.55);stroke-width:1.3}
.bubble.clear .ground{background:rgba(255,255,255,.28)}
.bubble.bare .ground{background:transparent;box-shadow:none}.bubble.bare .ground svg{width:84px;height:84px}
.ring{position:absolute;inset:-22px;border-radius:50%;border:4px solid var(--accent);opacity:0;pointer-events:none}
.edge{position:absolute;top:610px;width:6px;height:172px;border-radius:3px;background:var(--accent);opacity:0}
.edge.l{left:0}.edge.r{right:0}
.looks{position:absolute;left:0;right:0;top:820px;display:flex;justify-content:center;gap:16px;opacity:0}
.looks span{padding:12px 26px;border-radius:100px;border:2px solid var(--border);color:var(--sub);font-size:24px}
.looks span.on{border-color:var(--accent);color:var(--text);background:var(--surface)}
.chapter{position:absolute;bottom:38px;left:52px;display:flex;gap:9px}.chapter i{width:30px;height:5px;background:var(--border);border-radius:5px}.chapter i.on{background:var(--accent);width:64px}
</style></head><body><main id="stage" aria-label="This is your recording bubble.">
<header class="head"><span class="brand-mark"><svg class="brand-lips" viewBox="0 0 256 256" aria-hidden="true"><g transform="translate(8,13)"><rect x="16" y="84.2" width="14" height="20" rx="5" fill="#ff2a40"/><rect x="40" y="65.75" width="14" height="32" rx="5" fill="#ff8c00"/><rect x="64" y="43.36" width="14" height="48" rx="5" fill="#ffd700"/><rect x="88" y="63.04" width="14" height="36" rx="5" fill="#adff2f"/><rect x="112" y="81.43" width="14" height="24" rx="5" fill="#00fa9a"/><rect x="136" y="63.04" width="14" height="36" rx="5" fill="#00ffff"/><rect x="160" y="43.36" width="14" height="48" rx="5" fill="#1e90ff"/><rect x="184" y="65.75" width="14" height="32" rx="5" fill="#4169e1"/><rect x="208" y="84.2" width="14" height="20" rx="5" fill="#8a2be2"/><rect x="16" y="125.8" width="14" height="20" rx="5" fill="#4169e1"/><rect x="40" y="119.35" width="14" height="36" rx="5" fill="#1e90ff"/><rect x="64" y="112.96" width="14" height="48" rx="5" fill="#00ffff"/><rect x="88" y="120.64" width="14" height="60" rx="5" fill="#00fa9a"/><rect x="112" y="127.03" width="14" height="68" rx="5" fill="#adff2f"/><rect x="136" y="120.64" width="14" height="60" rx="5" fill="#ffd700"/><rect x="160" y="112.96" width="14" height="48" rx="5" fill="#ff8c00"/><rect x="184" y="119.35" width="14" height="36" rx="5" fill="#ff2a40"/><rect x="208" y="125.8" width="14" height="20" rx="5" fill="#8a2be2"/></g></svg>EnviousWispr</span><span class="count">2 / 5</span></header>
<div class="caption" id="c1">This is your recording bubble.<small>It appears whenever a text box is active.</small></div>
<div class="caption" id="c2">It lives on the left or the right side of your screen.<small>Drag it to the side you like.</small></div>
<div class="caption" id="c3">It comes in three looks.<small>Pick yours in Settings, Appearance.</small></div>
<div class="edge l"></div><div class="edge r"></div>
<div class="bubble" id="bubble"><div class="ring"></div><div class="ground"><svg class="lips" viewBox="0 0 256 256" aria-hidden="true"><g transform="translate(8,13)"><rect x="16" y="84.2" width="14" height="20" rx="5" fill="#ff2a40"/><rect x="40" y="65.75" width="14" height="32" rx="5" fill="#ff8c00"/><rect x="64" y="43.36" width="14" height="48" rx="5" fill="#ffd700"/><rect x="88" y="63.04" width="14" height="36" rx="5" fill="#adff2f"/><rect x="112" y="81.43" width="14" height="24" rx="5" fill="#00fa9a"/><rect x="136" y="63.04" width="14" height="36" rx="5" fill="#00ffff"/><rect x="160" y="43.36" width="14" height="48" rx="5" fill="#1e90ff"/><rect x="184" y="65.75" width="14" height="32" rx="5" fill="#4169e1"/><rect x="208" y="84.2" width="14" height="20" rx="5" fill="#8a2be2"/><rect x="16" y="125.8" width="14" height="20" rx="5" fill="#4169e1"/><rect x="40" y="119.35" width="14" height="36" rx="5" fill="#1e90ff"/><rect x="64" y="112.96" width="14" height="48" rx="5" fill="#00ffff"/><rect x="88" y="120.64" width="14" height="60" rx="5" fill="#00fa9a"/><rect x="112" y="127.03" width="14" height="68" rx="5" fill="#adff2f"/><rect x="136" y="120.64" width="14" height="60" rx="5" fill="#ffd700"/><rect x="160" y="112.96" width="14" height="48" rx="5" fill="#ff8c00"/><rect x="184" y="119.35" width="14" height="36" rx="5" fill="#ff2a40"/><rect x="208" y="125.8" width="14" height="20" rx="5" fill="#8a2be2"/></g></svg></div></div>
<div class="looks"><span id="k0" class="on">Smoke</span><span id="k1">Clear</span><span id="k2">Bare</span></div>
<div class="chapter" aria-hidden="true"><i class=""></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i></div>
</main><script>
const $=s=>document.querySelector(s);
const clamp=v=>Math.max(0,Math.min(1,v)), ease=v=>{v=clamp(v);return v*v*(3-2*v)}, between=(t,a,b)=>ease((t-a)/(b-a));
function theme(value){document.body.classList.toggle('light',value==='light')}
theme(new URLSearchParams(location.search).get('theme'));
window.sceneDuration=7;
const RIGHT=584, LEFT=24; // 12 dp from either edge
window.frame=t=>{t=Math.max(0,Math.min(7,Number(t)||0));
 // Captions: 0 to 2.3 the bubble; 2.3 to 4.6 the side; 4.6 to 7 the looks.
 const c1=between(t,.1,.5)*(1-between(t,2.0,2.3)), c2=between(t,2.3,2.7)*(1-between(t,4.3,4.6)), c3=between(t,4.6,5.0);
 $('#c1').style.opacity=c1;$('#c2').style.opacity=c2;$('#c3').style.opacity=c3;
 // Beat 1: a soft breath and a highlight ring around the real-size bubble.
 let pulse=0;for(const at of [.6,1.3]){const v=(t-at)/.6;if(v>=0&&v<=1)pulse=Math.sin(v*Math.PI)}
 const ring=$('.ring');ring.style.opacity=c1*.9;ring.style.transform=`scale(${1+.08*pulse})`;
 // Beat 2: slide to the left edge, rest, slide back. The lit edge names the side.
 const go=between(t,2.6,3.2), back=between(t,3.7,4.3);
 const x=RIGHT+(LEFT-RIGHT)*(go-back);
 $('#bubble').style.left=x+'px';
 $('.edge.l').style.opacity=c2*(go-back);$('.edge.r').style.opacity=c2*(1-(go-back));
 $('.ground').style.transform=`scale(${1+.06*pulse})`;
 // Beat 3: Smoke, Clear, Bare, 0.8 s each.
 const look=t<5.4?0:t<6.2?1:2;
 $('#bubble').className='bubble '+['smoke','clear','bare'][look];
 $('.looks').style.opacity=c3;for(let i=0;i<3;i++)$('#k'+i).classList.toggle('on',i===look);
};
window.frame(0);
let manual=false,previous=0,elapsed=0;
const embedded=window.parent!==window;
window.addEventListener('message',event=>{if(event.source!==parent)return;const d=event.data;if(d?.type==='ew-frame'){manual=true;theme(d.theme);window.frame(d.time)}if(d?.type==='ew-theme')theme(d.theme)});
window.ready=document.fonts.ready.then(()=>{window.frame(0);parent.postMessage({type:'ew-ready',scene:2},'*')});
if(!embedded&&!new URLSearchParams(location.search).has('capture')){window.ready.then(()=>requestAnimationFrame(function tick(now){if(!manual){if(previous)elapsed+=(now-previous)/1000;window.frame(elapsed%7)}previous=now;requestAnimationFrame(tick)}))}
</script></body></html>
